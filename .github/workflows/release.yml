# Cuts a Git tag and a GitHub Release whenever .claude-plugin/plugin.json
# `version` changes on main, and publishes to npm via OIDC Trusted Publisher.

name: Release on version change

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/plugin.json'
      - 'package.json'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    environment: Digital-Lake-LogNexus
    steps:
      - name: Checkout with previous commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          new_version=$(jq -r .version .claude-plugin/plugin.json)
          pkg_version=$(jq -r .version package.json)
          old_version=$(git show HEAD~1:.claude-plugin/plugin.json 2>/dev/null \
            | jq -r .version 2>/dev/null || echo "")

          echo "old_version=$old_version"
          echo "new_version=$new_version"
          echo "pkg_version=$pkg_version"

          if [ -z "$new_version" ] || [ "$new_version" = "null" ]; then
            echo "::error file=.claude-plugin/plugin.json::Could not parse version field in plugin.json"
            exit 1
          fi

          if [ "$new_version" != "$pkg_version" ]; then
            echo "::error::Version mismatch: .claude-plugin/plugin.json ($new_version) != package.json ($pkg_version)"
            exit 1
          fi

          if [ "$new_version" = "$old_version" ]; then
            echo "Version unchanged ($new_version); nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="v${new_version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        if: steps.detect.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.detect.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on remote — skipping release creation."
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 22
        if: steps.detect.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Upgrade npm CLI to latest (>= 11.5.1 required for tokenless OIDC)
        if: steps.detect.outputs.should_release == 'true'
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        if: steps.detect.outputs.should_release == 'true'
        run: npm ci

      - name: Lint check
        if: steps.detect.outputs.should_release == 'true'
        run: npm run lint

      - name: Run unit tests
        if: steps.detect.outputs.should_release == 'true'
        run: npm test

      - name: Build TypeScript
        if: steps.detect.outputs.should_release == 'true'
        run: npm run build

      - name: Create tag and GitHub Release
        if: steps.detect.outputs.should_release == 'true' && steps.check_tag.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.detect.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes
          echo "Released ${TAG}: $(gh release view "${TAG}" --json url --jq .url)"

      - name: Publish to npm (OIDC Trusted Publisher)
        if: steps.detect.outputs.should_release == 'true'
        run: npm publish --provenance --access public
