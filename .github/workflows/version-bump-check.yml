# Enforces the versioning policy from CONTRIBUTING.md:
# 1. Every PR to main must keep all 7 version surfaces in lockstep (`sync-version.mjs --check`).
# 2. Any PR that touches commands/, skills/, or .claude-plugin/ must bump `.claude-plugin/plugin.json` `version`.
# 3. Any PR that bumps version must include a matching `## [X.Y.Z]` heading in `CHANGELOG.md`.

name: Version bump check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enforce 7-surface version lockstep parity
        run: node scripts/sync-version.mjs --check

      - name: Verify plugin.json version bump on gated paths and CHANGELOG entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          gated_prefixes=(commands/ skills/ .claude-plugin/)

          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")

          gated_hit=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            for p in "${gated_prefixes[@]}"; do
              case "$f" in
                "$p"*) gated_hit="$f"; break ;;
              esac
            done
            [ -n "$gated_hit" ] && break
          done <<<"$changed"

          base_version=$(git show "$BASE_SHA:.claude-plugin/plugin.json" | jq -r .version)
          head_version=$(git show "$HEAD_SHA:.claude-plugin/plugin.json" | jq -r .version)

          echo "  base version: $base_version"
          echo "  head version: $head_version"

          if [ "$base_version" != "$head_version" ]; then
            if [ ! -f CHANGELOG.md ] || ! grep -Fq "## [${head_version}]" CHANGELOG.md; then
              echo "::error file=CHANGELOG.md::PR bumps version to ${head_version} without a matching '## [${head_version}]' heading in CHANGELOG.md."
              exit 1
            fi
            echo "Version bumped from $base_version to $head_version (CHANGELOG.md verified)."
          elif [ -n "$gated_hit" ]; then
            echo
            echo "::error file=.claude-plugin/plugin.json::PR touches gated paths (e.g. $gated_hit) but plugin.json version is unchanged ($base_version)."
            cat <<'MSG'

          This PR changes paths under commands/, skills/, or .claude-plugin/
          but does not bump .claude-plugin/plugin.json `version`.

          See CONTRIBUTING.md "Versioning Policy" section for the bump rule.
          MSG
            exit 1
          else
            echo "No gated paths changed; version bump not required."
          fi
