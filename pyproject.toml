[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lognexus-mcp"
version = "1.3.5"
description = "Universal Git-powered persistent memory, context rules & native MCP server for AI coding agents (Claude, OpenAI, Gemini, DeepSeek) across Linux, macOS, and Windows."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "Digital Lake" }
]
keywords = [
  "mcp",
  "mcp-server",
  "model-context-protocol",
  "git",
  "git-notes",
  "ai-agents",
  "claude",
  "cursor",
  "gemini",
  "deepseek",
  "linux",
  "macos",
  "windows",
  "cross-platform"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Version Control :: Git"
]

[project.urls]
Homepage = "https://github.com/digital-lake-ai/lognexus#readme"
Repository = "https://github.com/digital-lake-ai/lognexus"
Issues = "https://github.com/digital-lake-ai/lognexus/issues"
Changelog = "https://github.com/digital-lake-ai/lognexus/blob/main/CHANGELOG.md"

[project.scripts]
lognexus = "lognexus_mcp:main_cli"
lognexus-mcp = "lognexus_mcp:main_mcp"

[tool.setuptools.packages.find]
where = ["python"]
